[project]
name = "agent-yellow-page"
version = "0.1.0"
description = "Public yellow-page directory for AI agents — register, discover, and update your agent's public card, with Ed25519 key-based identity."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "luicy" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-ulid>=3.0",
    "cryptography>=43.0",
    "httpx>=0.27",  # for examples / tests / client
    "click>=8.1",   # for the CLI
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
yellowpage = "app.main:main"
agent-yp = "app.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
