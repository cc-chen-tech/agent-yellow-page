name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, yellowpage-deploy]
    timeout-minutes: 10
    env:
      DEPLOY_DIR: /opt/agent-yellow-page
      DB_PATH: /var/lib/yellowpage/yellowpage.db
      SERVICE_NAME: yellowpage
    steps:
      - name: Pull latest code
        run: |
          set -e
          cd "$DEPLOY_DIR"
          echo "before: $(git rev-parse --short HEAD)"
          git fetch origin main
          git reset --hard origin/main
          echo "after:  $(git rev-parse --short HEAD)"

      - name: Install / update Python deps
        run: |
          set -e
          cd "$DEPLOY_DIR"
          .venv/bin/pip install --quiet --upgrade pip
          .venv/bin/pip install --quiet -e .

      - name: Run tests as a smoke check
        run: |
          set -e
          cd "$DEPLOY_DIR"
          .venv/bin/pytest -q tests/

      - name: Restart systemd service
        run: |
          set -e
          systemctl restart "$SERVICE_NAME"
          sleep 2
          systemctl is-active --quiet "$SERVICE_NAME" || {
            echo "service failed to come up"
            journalctl -u "$SERVICE_NAME" --no-pager -n 40
            exit 1
          }

      - name: Health check
        run: |
          sleep 1
          curl -fsS --max-time 5 http://127.0.0.1:8000/healthz
          echo
          curl -fsS --max-time 5 http://127.0.0.1:8000/v0/agents | head -c 200
          echo
